version: 2

project_name: obsite

metadata:
  mod_timestamp: "{{.CommitTimestamp}}"

builds:
  - id: obsite
    main: ./cmd/obsite
    binary: obsite
    mod_timestamp: "{{.CommitTimestamp}}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/simp-lee/obsite/internal/cli.releaseVersion={{.Version}}
      - -X github.com/simp-lee/obsite/internal/cli.releaseCommit={{.Commit}}
      - -X github.com/simp-lee/obsite/internal/cli.releaseDateEpoch={{.CommitDate}}
      - -X github.com/simp-lee/obsite/internal/cli.releaseBuildType={{if .IsSnapshot}}snapshot{{else}}release{{end}}

archives:
  - id: release
    ids:
      - obsite
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{.CommitDate}}"
    files:
      - src: LICENSE
        info: &notice_info
          owner: root
          group: root
          mode: 0644
          mtime: "{{.CommitDate}}"
      - src: THIRD_PARTY.md
        info: *notice_info
      - src: internal/render/vendor/katex/LICENSE
        info: *notice_info
      - src: internal/render/vendor/mermaid/LICENSE
        info: *notice_info
      - src: internal/social/assets/DroidSansFallbackFull.LICENSE
        info: *notice_info
      - src: internal/markdown/PASSTHROUGH_LICENSE
        info: *notice_info
      - src: internal/recommend/chinese/THIRD_PARTY.md
        info: *notice_info
      - src: internal/recommend/chinese/LICENSE-APACHE-2.0
        info: *notice_info
      - src: internal/recommend/chinese/LICENSE-JIEBA-MIT
        info: *notice_info
      - src: internal/recommend/chinese/LICENSE-CEDAR-BSD-2-CLAUSE
        info: *notice_info

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: 0.0.0-snapshot-{{.ShortCommit}}

changelog:
  disable: true
